<!DOCTYPE html>
<html>
<head>
    <title>Grocery Bill</title>
</head>

<body>

<center>
<table border="1" width="60%">
    
    <caption><b>Grocery Bill</b></caption>

    <tr bgcolor="yellow">
        <th>Category</th>
        <th>Sr.No</th>
        <th>Item</th>
        <th>Qty</th>
        <th>Price</th>
    </tr>

    <!-- Grains Category (2 rows merged using rowspan) -->
    <tr>
        <td align="center" rowspan="2">Grains</td>
        <td align="center">1</td>
        <td align="center">Rice</td>
        <td align="center">5kg</td>
        <td align="center">500</td>
    </tr>

    <tr>
        <td align="center">2</td>
        <td align="center">Sugar</td>
        <td align="center">2kg</td>
        <td align="center">200</td>
    </tr>

    <!-- Oils Category -->
    <tr>
        <td align="center">Oils</td>
        <td align="center">3</td>
        <td align="center">Oil</td>
        <td align="center">2L</td>
        <td align="center">300</td>
    </tr>

    <!-- Dairy Category -->
    <tr>
        <td align="center">Dairy</td>
        <td align="center">4</td>
        <td align="center">Milk</td>
        <td align="center">10pkt</td>
        <td align="center">300</td>
    </tr>

    <tr>
        <td colspan="4" align="center"><b>Total</b></td>
        <td align="center"><b>1300/-</b></td>
    </tr>

</table>
</center>

</body>
</html>
