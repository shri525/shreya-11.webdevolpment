<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
<link rel="stylesheet" href="style.css">
</head>

<body bgcolor="lightblue">

<h2>Student Registration Form</h2>

<form action="success.html">

First Name:<br>
<input type="text" required>
<br><br>

Middle Name:<br>
<input type="text" required>
<br><br>

Last Name:<br>
<input type="text" required>
<br><br>

Birth Date:<br>
<input type="text" required>
<br><br>

Gender:<br>
<input type="radio" name="g" required> Male
<input type="radio" name="g" required> Female
<br><br>

Address:<br>
<textarea required></textarea>
<br><br>

College Name:<br>
<select required>
<option value="">Select College</option>
<option>Shivaji University</option>
<option> DYPCET college</option>
<option>Pune University</option>
<option>Modern College</option>
<option>MIT College</option>
<option>COEP College</option>
</select>
<br><br>

Branch:<br>
<select required>
<option value="">Select Branch</option>
<option>Computer Engineering</option>
<option>Information Technology</option>
<option>Mechanical Engineering</option>
<option>Civil Engineering</option>
<option>Electrical Engineering</option>
</select>
<br><br>

Technical Skills:<br>
<input type="checkbox"> HTML
<input type="checkbox"> CSS
<input type="checkbox"> Java
<input type="checkbox"> Python
<br><br>

<input type="submit" value="Submit">

</form>

</body>
</html>
